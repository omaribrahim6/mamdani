name: mamdani-dev
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mamdani
      POSTGRES_PASSWORD: mamdani_dev
      POSTGRES_DB: mamdani
    ports:
      - "127.0.0.1:${MAMDANI_DEV_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mamdani -d mamdani"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
