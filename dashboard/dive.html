<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mamdani dive lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <div id="root"></div>
    <script>
      // ?raf: keep animating even when this tab isn't drawing (headless checks)
      if (location.search.includes('raf')) {
        window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
        window.cancelAnimationFrame = (id) => clearTimeout(id);
      }
    </script>
    <script type="module" src="/src/dev/diveLab.tsx"></script>
  </body>
</html>
